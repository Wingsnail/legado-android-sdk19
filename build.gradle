// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.5.31'
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'de.timfreiheit.resourceplaceholders:placeholders:0.4'
        classpath 'de.undercouch:gradle-download-task:4.1.2'
    }
}

android {
    compileSdkVersion 30  // 需 ≥30 以支持 AGP 7.0.2
    buildToolsVersion "30.0.3"  // 最低要求 30.0.2

    defaultConfig {
        targetSdkVersion 19  // 保持 Android 4.4 兼容
        minSdkVersion 19
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.5.31"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.5.31"
        }
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
